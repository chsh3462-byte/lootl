<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대충 만든 쓰레기 - 지하 도박장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            background-color: #050508;
            color: #ffffff;
            user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }
        .neon-title { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0077, 0 0 80px #ff0055; }
        .gold-glow { text-shadow: 0 0 10px #eab308, 0 0 20px #ca8a04; }
        .glitch-text { animation: glitch 1.5s infinite; }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-5">

    <!-- Top Casino Header -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center bg-gray-900/95 p-4 rounded-3xl border-2 border-pink-500/60 mb-3 shadow-2xl backdrop-blur">
        <div class="text-center sm:text-left mb-2 sm:mb-0">
            <h1 class="text-3xl sm:text-4xl font-black tracking-wider text-pink-500 neon-title glitch-text">
                🗑️ 대충 만든 쓰레기 🗑️
            </h1>
            <p class="text-xs sm:text-sm text-yellow-400 gold-glow">자동 저장 지원 - 빚 갚는 리얼 도박장</p>
        </div>

        <div class="flex items-center space-x-3">
            <div class="bg-black/90 px-4 py-2 rounded-2xl border-2 border-yellow-500 flex flex-col items-end">
                <span class="text-[10px] text-yellow-500/80 font-bold">보유 포인트</span>
                <span id="userBalanceDisplay" class="text-2xl font-black text-yellow-400 gold-glow">100,000</span>
            </div>
            <div class="bg-black/90 px-4 py-2 rounded-2xl border-2 border-red-600 flex flex-col items-end">
                <span class="text-[10px] text-red-500/80 font-bold">사채 빚 (이자없음)</span>
                <span id="userDebtDisplay" class="text-xl font-black text-red-500">0</span>
            </div>
            <button id="resetDataBtn" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-xs font-bold transition shadow-lg">
                초기화
            </button>
        </div>
    </header>

    <!-- Game Mode Selector -->
    <nav class="w-full max-w-4xl grid grid-cols-2 gap-2 mb-3">
        <button data-tab="pachinko" class="game-tab-btn py-3 px-2 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black rounded-2xl text-sm border-2 border-pink-400 shadow-lg">
            <span>1. 파친코</span>
        </button>
        <button data-tab="slot" class="game-tab-btn py-3 px-2 bg-gray-800 text-gray-400 font-bold rounded-2xl text-sm border-2 border-gray-700 shadow-md">
            <span>2. VIP 슬롯</span>
        </button>
    </nav>

    <!-- Main Casino Area -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center relative">
        
        <!-- 1. 파친코 -->
        <section id="game-pachinko" class="game-section w-full max-w-[460px] bg-gray-900 border-4 border-pink-500/80 rounded-3xl p-4 flex flex-col items-center">
            <div class="w-full aspect-[4/5] bg-gray-950 rounded-2xl p-1 border-2 border-pink-500/40 relative overflow-hidden">
                <canvas id="pachinkoCanvas" class="w-full h-full cursor-pointer"></canvas>
            </div>
            <button id="pachinkoShootBtn" class="w-full py-4 mt-3 bg-gradient-to-r from-yellow-400 via-pink-500 to-rose-600 text-black font-black text-xl rounded-2xl shadow-xl active:scale-95 transition">
                💥 구슬 발사 (-500 P)
            </button>
        </section>

        <!-- 2. 슬롯 머신 -->
        <section id="game-slot" class="game-section w-full max-w-md bg-gray-900 border-4 border-purple-500/80 rounded-3xl p-5 flex flex-col items-center hidden">
            <div class="w-full bg-black border-4 border-purple-500 rounded-2xl p-5 my-2 flex justify-center items-center gap-3">
                <div class="flex gap-3 text-5xl py-2">
                    <div id="vReel1" class="bg-gray-800 w-20 h-28 flex items-center justify-center">🎰</div>
                    <div id="vReel2" class="bg-gray-800 w-20 h-28 flex items-center justify-center">🎰</div>
                    <div id="vReel3" class="bg-gray-800 w-20 h-28 flex items-center justify-center">🎰</div>
                </div>
            </div>
            <div id="slotPayoutMsg" class="text-sm font-black text-yellow-300 my-2">버튼을 눌러 스핀하세요!</div>
            <button id="vipSpinBtn" class="w-full py-4 mt-2 bg-purple-600 hover:bg-purple-500 text-white font-black text-xl rounded-2xl shadow-xl">
                🎰 스핀 돌리기! (-5000 P)
            </button>
        </section>
    </main>

    <!-- 하단 사채 및 상환 시스템 -->
    <div class="w-full max-w-4xl bg-gray-900 border-2 border-red-600/80 p-4 rounded-2xl mt-4 flex flex-col sm:flex-row justify-between items-center gap-2">
        <div>
            <span class="text-sm font-black text-gray-200">지하 사채업자</span>
            <p class="text-xs text-gray-400">돈을 잃으셨나요? 대출을 받고 딴 돈으로 갚으세요.</p>
        </div>
        <div class="flex gap-2">
            <button id="repayDebtBtn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-black text-sm rounded-xl shadow-lg">
                💳 빚 갚기 (-5만P)
            </button>
            <button id="loanSharkBtn" class="px-5 py-3 bg-red-600 hover:bg-red-500 text-white font-black text-sm rounded-xl shadow-lg animate-bounce">
                💸 대출 받기 (+5만P)
            </button>
        </div>
    </div>

    <!-- 알림 모달 -->
    <div id="customModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-gray-900 border-2 border-pink-500 p-6 rounded-3xl max-w-xs w-full text-center">
            <h3 id="modalTitle" class="text-2xl font-black text-pink-400 mb-2">알림</h3>
            <p id="modalMsg" class="text-sm text-gray-300 mb-4">메시지 내용</p>
            <button id="modalCloseBtn" class="w-full py-3 bg-pink-600 text-white font-bold rounded-xl">확인</button>
        </div>
    </div>

    <script>
        // --- 1. 자동 저장 시스템 (LocalStorage) ---
        let userBalance = 100000;
        let userDebt = 0;

        // 브라우저에서 데이터 불러오기
        function loadData() {
            const savedBalance = localStorage.getItem('trashGameBalance');
            const savedDebt = localStorage.getItem('trashGameDebt');
            
            if (savedBalance !== null) userBalance = parseInt(savedBalance);
            if (savedDebt !== null) userDebt = parseInt(savedDebt);
            updateUI();
        }

        // 브라우저에 데이터 저장하기
        function saveData() {
            localStorage.setItem('trashGameBalance', userBalance);
            localStorage.setItem('trashGameDebt', userDebt);
            updateUI();
        }

        // 데이터 초기화
        document.getElementById('resetDataBtn').addEventListener('click', () => {
            if(confirm("모든 데이터를 초기화하시겠습니까?")) {
                userBalance = 100000;
                userDebt = 0;
                saveData();
                showAlert("초기화 완료", "기본 자금 10만 포인트로 리셋되었습니다.");
            }
        });

        function updateUI() {
            document.getElementById('userBalanceDisplay').innerText = userBalance.toLocaleString();
            document.getElementById('userDebtDisplay').innerText = userDebt.toLocaleString();
        }

        function addBalance(amount) {
            userBalance += amount;
            saveData(); // 잔액이 변동될 때마다 자동 저장
        }

        // 사채 대출 시스템
        document.getElementById('loanSharkBtn').addEventListener('click', () => {
            addBalance(50000);
            userDebt += 50000;
            saveData();
            showAlert("🩸 대출 완료", "50,000 P를 빌렸습니다. 빚이 늘어났습니다!");
        });

        // 사채 빚 갚기 시스템
        document.getElementById('repayDebtBtn').addEventListener('click', () => {
            if (userDebt <= 0) {
                showAlert("안내", "현재 갚을 빚이 없습니다!");
                return;
            }
            if (userBalance < 50000) {
                showAlert("💸 잔액 부족", "빚을 갚으려면 최소 50,000 P가 필요합니다.");
                return;
            }
            addBalance(-50000);
            userDebt -= 50000;
            saveData();
            showAlert("💳 상환 완료", "50,000 P의 빚을 갚았습니다!");
        });

        function showAlert(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('customModal').classList.remove('hidden');
        }
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            document.getElementById('customModal').classList.add('hidden');
        });

        // --- 2. 탭 전환 기능 ---
        function switchTab(tabName) {
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.game-tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "game-tab-btn py-3 px-2 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black rounded-2xl text-sm border-2 border-pink-400 shadow-lg";
                } else {
                    btn.className = "game-tab-btn py-3 px-2 bg-gray-800 text-gray-400 font-bold rounded-2xl text-sm border-2 border-gray-700 shadow-md";
                }
            });
            document.getElementById(`game-${tabName}`).classList.remove('hidden');
            if (tabName === 'pachinko') resizePachinko();
        }

        document.querySelectorAll('.game-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // --- 3. 게임 로직 (파친코 & 슬롯 간소화) ---
        // 슬롯 머신
        const slotSymbols = ['7️⃣', '💎', '🎰', '🍒'];
        let isSlotSpinning = false;
        
        document.getElementById('vipSpinBtn').addEventListener('click', () => {
            if (isSlotSpinning) return;
            if (userBalance < 5000) return showAlert("포인트 부족", "5000 P가 필요합니다.");
            
            addBalance(-5000);
            isSlotSpinning = true;
            let ticks = 0;
            const timer = setInterval(() => {
                ticks++;
                document.getElementById('vReel1').innerText = slotSymbols[Math.floor(Math.random() * 4)];
                document.getElementById('vReel2').innerText = slotSymbols[Math.floor(Math.random() * 4)];
                document.getElementById('vReel3').innerText = slotSymbols[Math.floor(Math.random() * 4)];
                
                if (ticks >= 20) {
                    clearInterval(timer);
                    isSlotSpinning = false;
                    const r1 = slotSymbols[Math.floor(Math.random() * 4)];
                    const r2 = slotSymbols[Math.floor(Math.random() * 4)];
                    const r3 = slotSymbols[Math.floor(Math.random() * 4)];
                    document.getElementById('vReel1').innerText = r1;
                    document.getElementById('vReel2').innerText = r2;
                    document.getElementById('vReel3').innerText = r3;

                    if (r1 === r2 && r2 === r3) {
                        addBalance(50000);
                        document.getElementById('slotPayoutMsg').innerText = "🎉 잭팟! 50,000 P 획득!";
                    } else {
                        document.getElementById('slotPayoutMsg').innerText = "꽝입니다.";
                    }
                }
            }, 50);
        });

        // 파친코 캔버스 설정 (기본 구슬 떨어지기)
        const canvas = document.getElementById('pachinkoCanvas');
        const ctx = canvas.getContext('2d');
        let balls = [];

        function resizePachinko() {
            if (!canvas.parentElement) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        document.getElementById('pachinkoShootBtn').addEventListener('click', () => {
            if (userBalance < 500) return showAlert("포인트 부족", "500 P가 필요합니다.");
            addBalance(-500);
            balls.push({ x: canvas.width / 2 + (Math.random()*40-20), y: 10, vy: 0, r: 6 });
        });

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 중앙 당첨 구멍
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(canvas.width/2 - 20, canvas.height - 30, 40, 20);

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                b.vy += 0.2; // 중력
                b.y += b.vy;
                
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                // 당첨 판정
                if (b.y > canvas.height - 30 && b.x > canvas.width/2 - 20 && b.x < canvas.width/2 + 20) {
                    addBalance(2000);
                    balls.splice(i, 1);
                } else if (b.y > canvas.height) {
                    balls.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }

        // 초기화 실행
        window.addEventListener('load', () => {
            loadData();
            resizePachinko();
            requestAnimationFrame(loop);
        });
        window.addEventListener('resize', resizePachinko);

    </script>
</body>
</html>
